name: ServerBee
options:
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_LANGUAGE: en
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1
packages:
  SwiftLintPlugins:
    url: https://github.com/SimplyDanny/SwiftLintPlugins
    from: "0.57.0"
targets:
  ServerBee:
    type: application
    platform: iOS
    sources:
      - path: ServerBee
      - path: NotificationShared
    settings:
      base:
        INFOPLIST_FILE: ServerBee/Info.plist
        INFOPLIST_KEY_CFBundleAllowMixedLocalizations: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.serverbee.mobile
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_STRICT_CONCURRENCY: complete
        # Emit compiler-extracted localizable strings so future builds surface
        # untranslated keys via `xcodebuild -exportLocalizations`. Catches the
        # implicit-LocalizedStringKey literals (Text("…"), Button("…"), …) that a
        # `String(localized:)`-only grep would miss.
        SWIFT_EMIT_LOC_STRINGS: YES
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - AppIntents
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: ServerBee/ServerBee.Debug.entitlements
          PUSH_APNS_ENVIRONMENT: sandbox
        Release:
          CODE_SIGN_ENTITLEMENTS: ServerBee/ServerBee.Release.entitlements
          PUSH_APNS_ENVIRONMENT: production
    dependencies:
      - target: NotificationService
        embed: true
    buildToolPlugins:
      - plugin: SwiftLintBuildToolPlugin
        package: SwiftLintPlugins

  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
      - path: NotificationShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.serverbee.mobile.notifications
        INFOPLIST_FILE: NotificationService/Info.plist
        CODE_SIGN_ENTITLEMENTS: NotificationService/NotificationService.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_EMIT_LOC_STRINGS: YES
    buildToolPlugins:
      - plugin: SwiftLintBuildToolPlugin
        package: SwiftLintPlugins

  ServerBeeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ServerBeeTests
      - path: NotificationServiceTests
      - path: NotificationService/NotificationService.swift
      - path: ../../tests/fixtures/push-envelope-v1.json
        buildPhase: resources
      - path: ../../tests/fixtures/push-alert-envelope-v1.json
        buildPhase: resources
    dependencies:
      - target: ServerBee
    settings:
      base:
        INFOPLIST_FILE: ServerBeeTests/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.serverbee.mobile.tests
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SERVERBEE_EXTENSION_TESTS"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ServerBee.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ServerBee"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - AppIntents
schemes:
  ServerBee:
    build:
      targets:
        ServerBee: all
        ServerBeeTests: [test]
    test:
      targets:
        - ServerBeeTests
      gatherCoverageData: true
