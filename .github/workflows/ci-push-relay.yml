name: CI Push Relay

on:
  push:
    branches: [main]
    paths: ['apps/push-relay/**', 'tests/fixtures/push-envelope-v1.json', 'bun.lock', '.github/workflows/ci-push-relay.yml']
  pull_request:
    branches: [main]
    paths: ['apps/push-relay/**', 'tests/fixtures/push-envelope-v1.json', 'bun.lock', '.github/workflows/ci-push-relay.yml']

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Check Worker and fixture types
        run: bun --filter @serverbee/push-relay typecheck
      - name: Test actual Workers runtime and APNs fetch boundaries
        run: bun --filter @serverbee/push-relay test
      - name: Verify production bundle without deploying
        run: bun --filter @serverbee/push-relay build
        env:
          WRANGLER_SEND_METRICS: false
