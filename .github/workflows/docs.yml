name: Documentation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - '.github/workflows/docs.yml'
      - '.github/workflows/release.yml'
      - 'apps/docs/**'
      - 'apps/ios/project.yml'
      - 'apps/ios/ServerBee/ViewModels/AgentLifecycleViewModel.swift'
      - 'apps/web/src/components/server/*enrollment-dialog.tsx'
      - 'apps/web/src/components/server/add-server-dialog.tsx'
      - 'Cargo.toml'
      - 'crates/common/src/constants.rs'
      - 'deploy/install.sh'
      - 'deploy/railway/Dockerfile'
      - 'deploy/railway/README.md'
      # The docs dependencies, and patches/fumadocs-ui@16.6.16.patch, which translates its labels.
      - 'bun.lock'
      - 'package.json'
      - 'patches/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - '.github/workflows/docs.yml'
      - '.github/workflows/release.yml'
      - 'apps/docs/**'
      - 'apps/ios/project.yml'
      - 'apps/ios/ServerBee/ViewModels/AgentLifecycleViewModel.swift'
      - 'apps/web/src/components/server/*enrollment-dialog.tsx'
      - 'apps/web/src/components/server/add-server-dialog.tsx'
      - 'Cargo.toml'
      - 'crates/common/src/constants.rs'
      - 'deploy/install.sh'
      - 'deploy/railway/Dockerfile'
      - 'deploy/railway/README.md'
      # The docs dependencies, and patches/fumadocs-ui@16.6.16.patch, which translates its labels.
      - 'bun.lock'
      - 'package.json'
      - 'patches/**'

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Build and route contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The route checks run against the Vite dev server, which runs on Node. On Node 26 it drops every response header
      # the app sets, such as Content-Type and Location, so pin a release the checks pass on.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        working-directory: apps/docs
        run: bun run types:check

      - name: Check documentation contracts
        working-directory: apps/docs
        run: bun run check:contracts

      - name: Validate published Compose examples
        shell: bash
        run: |
          for locale in en zh; do
            awk '/^## Docker Compose/{section=1} section && /^```yaml/{block=1; next} block && /^```/{exit} block{print}' \
              "apps/docs/content/docs/${locale}/deployment.mdx" \
              | docker compose -f - config --quiet
          done

      - name: Build production documentation
        working-directory: apps/docs
        run: bun run build

      - name: Smoke-test localized routes
        working-directory: apps/docs
        shell: bash
        run: |
          bun run dev --host 127.0.0.1 > /tmp/serverbee-docs.log 2>&1 &
          docs_pid=$!
          trap 'kill "$docs_pid" 2>/dev/null || true' EXIT
          bun run check:routes
