name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.2.1). Leave empty to use the selected tag."
        required: false

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: Release Preflight
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - uses: oven-sh/setup-bun@v2

      - name: Validate version and changelog
        id: version
        shell: bash
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            echo "::error::Release must run from an existing v* tag"
            exit 1
          fi

          if [[ "$GITHUB_REF" != "refs/tags/v$VERSION" ]]; then
            echo "::error::Selected ref $GITHUB_REF does not match v$VERSION"
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid semantic version: $VERSION"
            exit 1
          fi

          CARGO_VERSION=$(awk -F '"' '/^version = "/ { print $2; exit }' Cargo.toml)
          WEB_VERSION=$(bun -e "console.log(require('./apps/web/package.json').version)")
          if [[ "$CARGO_VERSION" != "$VERSION" || "$WEB_VERSION" != "$VERSION" ]]; then
            echo "::error::Version mismatch: tag=$VERSION cargo=$CARGO_VERSION web=$WEB_VERSION"
            exit 1
          fi

          if ! scripts/extract-changelog.sh "$VERSION" > changelog_body.md; then
            echo "::error::CHANGELOG.md has no non-empty section for $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        working-directory: apps/web
        run: bun install --frozen-lockfile

      - name: Test and build frontend
        working-directory: apps/web
        run: bun run typecheck && bun run test && bun run build

      - name: Check frontend formatting and lint
        run: bun x ultracite check

      - name: Validate installer upgrade rollback
        run: |
          dash -n deploy/install.sh deploy/test-install-upgrade.sh scripts/extract-changelog.sh scripts/test-extract-changelog.sh
          dash deploy/test-install-upgrade.sh
          dash scripts/test-extract-changelog.sh
          shellcheck --shell=dash --severity=warning deploy/install.sh deploy/test-install-upgrade.sh scripts/extract-changelog.sh scripts/test-extract-changelog.sh

      - name: Test Rust workspace
        run: cargo test --workspace --locked

      - name: Lint Rust workspace
        run: cargo clippy --workspace --benches --tests --examples --all-features --locked -- -D warnings

  build-linux:
    name: Build (${{ matrix.target }})
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            suffix: linux-amd64
          - target: aarch64-unknown-linux-musl
            suffix: linux-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          key: release-${{ matrix.target }}

      - uses: oven-sh/setup-bun@v2

      - name: Install cargo-zigbuild
        run: pip install cargo-zigbuild

      - name: Build frontend
        working-directory: apps/web
        run: bun install --frozen-lockfile && bun run build

      - name: Build release
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}

      - name: Package binaries
        run: |
          cd target/${{ matrix.target }}/release
          cp serverbee-server serverbee-server-${{ matrix.suffix }}
          cp serverbee-agent serverbee-agent-${{ matrix.suffix }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.suffix }}
          path: |
            target/${{ matrix.target }}/release/serverbee-server-${{ matrix.suffix }}*
            target/${{ matrix.target }}/release/serverbee-agent-${{ matrix.suffix }}*

  build-other:
    name: Build (${{ matrix.target }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            suffix: darwin-amd64
          - target: aarch64-apple-darwin
            os: macos-latest
            suffix: darwin-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            suffix: windows-amd64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          key: release-${{ matrix.target }}

      - uses: oven-sh/setup-bun@v2

      - name: Build frontend
        working-directory: apps/web
        run: bun install --frozen-lockfile && bun run build

      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package binaries (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          cp serverbee-server serverbee-server-${{ matrix.suffix }}
          cp serverbee-agent serverbee-agent-${{ matrix.suffix }}

      - name: Package binaries (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          cp serverbee-server.exe serverbee-server-${{ matrix.suffix }}.exe
          cp serverbee-agent.exe serverbee-agent-${{ matrix.suffix }}.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.suffix }}
          path: |
            target/${{ matrix.target }}/release/serverbee-server-${{ matrix.suffix }}*
            target/${{ matrix.target }}/release/serverbee-agent-${{ matrix.suffix }}*

  docker:
    name: Docker (${{ matrix.component }})
    needs: [preflight, build-linux, build-other]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: server
            image: serverbee-server
          - component: agent
            image: serverbee-agent
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          path: docker-bins
          pattern: release-linux-*
          merge-multiple: true

      - name: Prepare binaries
        run: |
          mkdir -p docker-bins/linux-amd64 docker-bins/linux-arm64
          mv docker-bins/serverbee-${{ matrix.component }}-linux-amd64 docker-bins/linux-amd64/serverbee-${{ matrix.component }}
          mv docker-bins/serverbee-${{ matrix.component }}-linux-arm64 docker-bins/linux-arm64/serverbee-${{ matrix.component }}
          chmod +x docker-bins/linux-amd64/* docker-bins/linux-arm64/*

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner
        id: owner
        run: echo "lowercase=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Compute image tags
        id: tags
        run: |
          IMAGE="ghcr.io/${{ steps.owner.outputs.lowercase }}/${{ matrix.image }}"
          VERSION="${{ needs.preflight.outputs.version }}"
          {
            echo "list<<EOF"
            echo "$IMAGE:$VERSION"
            # Keep separate moving tags so prereleases never replace stable :latest.
            if [[ "$VERSION" == *-* ]]; then
              echo "$IMAGE:beta"
            else
              echo "$IMAGE:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.component }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.list }}

  release:
    name: Create Release
    needs: [preflight, build-linux, build-other, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog
        id: changelog
        run: |
          scripts/extract-changelog.sh '${{ needs.preflight.outputs.version }}' > changelog_body.md

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          # install.sh fetches this exact filename for binary verification.
          # Hash only the binaries to avoid self-including the sums file.
          sha256sum serverbee-* > sha256sums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.preflight.outputs.version }}
          body_path: changelog_body.md
          files: artifacts/*
          prerelease: ${{ contains(needs.preflight.outputs.version, '-') }}
          make_latest: ${{ !contains(needs.preflight.outputs.version, '-') }}

      - name: Verify public release channel metadata
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
        shell: bash
        run: |
          tag="v${VERSION}"
          verified=false
          for attempt in {1..10}; do
            actual_prerelease="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq '.prerelease')"
            latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name' 2>/dev/null || true)"
            if [[ "$VERSION" == *-* && "$actual_prerelease" == true && "$latest_tag" != "$tag" ]]; then
              verified=true
              break
            fi
            if [[ "$VERSION" != *-* && "$actual_prerelease" == false && "$latest_tag" == "$tag" ]]; then
              verified=true
              break
            fi
            sleep 3
          done
          [[ "$verified" == true ]]
